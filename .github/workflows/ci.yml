name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portal:
    name: Format, lint, types, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # The pnpm version pinned in package.json ("packageManager").
      - name: Install pnpm and dependencies
        run: |
          npm install -g "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Format (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Types (tsc)
        run: pnpm typecheck

      - name: Generated API types match the OpenAPI snapshot
        run: pnpm api:check

      - name: Tests (Vitest)
        run: pnpm test

      - name: Build (Next.js)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
